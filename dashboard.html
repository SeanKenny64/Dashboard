<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Dashboard</title>

  <style>
    :root {
      --bg: #0b0c0f;
      --card: #141622;
      --muted: #9aa3b2;
      --text: #e8eaf0;
      --border: #24283a;
      --radius: 16px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    header {
      padding: 22px;
      display: flex;
      gap: 16px;
      align-items: center;
      flex-wrap: wrap;
    }

    .clock { font-size: 20px; font-weight: 600; }
    .date { font-size: 14px; color: var(--muted); }
    .spacer { flex: 1; }

    /* SEARCH STYLES */
    .search-container {
      display: flex;
      gap: 8px;
      width: min(640px, 100%);
    }

    .search-select {
      padding: 10px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #0f111a;
      color: var(--text);
      cursor: pointer;
      outline: none;
    }

    #search-input {
      flex: 1;
      padding: 12px 18px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: #0f111a;
      color: var(--text);
      outline: none;
    }

    .search-container button {
      padding: 12px 20px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      cursor: pointer;
      font-weight: 600;
    }

    /* MAIN LAYOUT */
    main {
      padding: 0 22px 26px;
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      align-content: flex-start;
      min-height: calc(100vh - 120px);
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      min-height: 120px;
      transition: all 0.3s ease;
      flex: 1 0 300px;
      max-width: calc(50% - 7px);
    }

    .card[data-card="arena"],
    .card[data-card="quick-launch"] { flex: 1 0 calc(50% - 7px); max-width: calc(50% - 7px); }

    .card[data-card="gmail"],
    .card[data-card="daily-checkin"] { flex: 1 0 calc(33.333% - 10px); max-width: calc(33.333% - 10px); }

    .card[data-card="notes"] { flex: 2 0 400px; max-width: calc(66.666% - 7px); }

    .card[data-card="recent-links"] { flex: 1 0 200px; max-width: calc(33.333% - 7px); }

    .card[data-card="bookmarks"] { flex: 0 0 100%; max-width: 100%; }

    .card h2 {
      margin: 0 0 10px;
      font-size: 13px;
      letter-spacing: .4px;
      text-transform: uppercase;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }

    /* MINIMIZE BUTTONS */
    .minimize-btn {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      transition: 0.2s;
    }

    .minimize-btn:hover {
      color: #ff4444; /* ADHD Visual Feedback: Red for close */
      background: rgba(255, 68, 68, 0.1);
    }

    /* REST OF STYLES (Tiles, Toggles, etc) */
    .restore-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      color: var(--muted);
      cursor: pointer;
      font-size: 12px;
      padding: 4px 8px;
      border-radius: 6px;
      margin-left: 8px;
    }

    .minimized-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .minimized-item { display: flex; align-items: center; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; font-size: 12px; }
    .tiles { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
    .tile { display: block; padding: 12px; border-radius: 14px; border: 1px solid var(--border); background: #0f111a; color: var(--text); text-decoration: none; }
    .tileRow { display: flex; align-items: center; gap: 10px; }
    .favicon { width: 22px; height: 22px; border-radius: 6px; flex: 0 0 22px; background: #0b0c0f; border: 1px solid var(--border); }
    .tileTitle { font-weight: 600; }
    .tileMeta { color: var(--muted); margin-top: 4px; font-size: 12px; }
    textarea { width: 100%; min-height: 180px; resize: vertical; padding: 12px; border-radius: 14px; border: 1px solid var(--border); background: #0f111a; color: var(--text); }
    .toggle { padding: 16px; font-size: 16px; border-radius: 14px; border: 1px solid var(--border); background: #0f111a; color: var(--text); cursor: pointer; }
    .toggle.active { border-color: #4CAF50; background: rgba(76, 175, 80, 0.1); }
    .scrollList { max-height: 260px; overflow-y: auto; padding-right: 10px; }

    @keyframes timer-flash { 0% { background-color: var(--bg); } 50% { background-color: #ff4444; } 100% { background-color: var(--bg); } }
    .flashing-active { animation: timer-flash 0.5s infinite !important; }

    @media (max-width: 900px) { main { flex-direction: column; } .card { flex: 0 0 100% !important; } }
  </style>
</head>

<body>
  <header>
    <div class="search-container">
      <select id="search-engine-selector" class="search-select">
        <option value="https://duckduckgo.com/?q=">DDG</option>
        <option value="https://google.com/search?q=">Google</option>
        <option value="https://en.wikipedia.org/wiki/Special:Search?search=">Wiki</option>
        <option value="https://web.archive.org/web/*/">Archive</option>
      </select>
      <input type="text" id="search-input" placeholder="Search or enter URL..." autocomplete="off">
      <button onclick="executeSearch()">Go</button>
    </div>

    <button id="timerBtn" class="toggle" style="margin-left: 10px; padding: 10px 16px; font-size: 14px;">⏲ Set Timer</button>
    <div class="spacer"></div>
    <div>
      <div class="clock" id="clock">--:--</div>
      <div class="date" id="date">---</div>
    </div>
  </header>

  <main>
    <section class="card" data-card="arena">
      <h2>Arena <button class="minimize-btn" data-card="arena"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button></h2>
      <iframe src="cgi-bin/arena.py" style="width: 100%; height: 300px; border: 1px solid var(--border); border-radius: var(--radius); background: #000;"></iframe>
    </section>

    <section class="card" data-card="quick-launch">
      <h2>Quick Launch <button class="minimize-btn" data-card="quick-launch"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button></h2>
      <div class="tiles" id="tiles"></div>
    </section>

    <section class="card" data-card="gmail">
      <h2>Gmail <button class="minimize-btn" data-card="gmail"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button></h2>
      <div id="gmail-count">Loading...</div>
    </section>

    <section class="card" data-card="daily-checkin">
      <h2>Daily Check-in <button class="minimize-btn" data-card="daily-checkin"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button></h2>
      <div class="tiles">
        <button class="toggle" data-key="drink">🍺 Drank</button>
        <button class="toggle" data-key="smoke">🚬 Smoked</button>
        <button class="toggle" data-key="bad_sleep">😵 Bad sleep</button>
        <button class="toggle" data-key="civ">🎮 Civ</button>
      </div>
      <div style="margin-top: 0.5rem;">
        <button id="submit-checkin">Submit</button>
        <span id="checkin-status"></span>
      </div>
    </section>

    <section class="card minimized-section" id="minimized-section" style="display: none;">
      <h2>Minimized Panels <button class="restore-btn" id="restore-all">Restore All</button></h2>
      <div class="minimized-list" id="minimized-list"></div>
    </section>

    <section class="card bookmarks" data-card="bookmarks">
      <h2>Bookmarks <button class="minimize-btn" data-card="bookmarks"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button></h2>
      <div style="display:flex; gap:10px; flex-wrap:wrap; margin-bottom:10px;">
        <input id="bmSearch" placeholder="Filter bookmarks…" style="flex:1; min-width:220px;">
        <select id="bmSort">
          <option value="az">A → Z</option>
          <option value="za">Z → A</option>
        </select>
      </div>
      <ul id="bmList" class="scrollList"></ul>
    </section>

    <section class="card" data-card="notes">
      <h2>Notes <button class="minimize-btn" data-card="notes"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button></h2>
      <textarea id="notes" placeholder="Scratchpad (autosaves locally)…"></textarea>
    </section>

    <section class="card" data-card="recent-links">
      <h2>Recent Links <button class="minimize-btn" data-card="recent-links"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button></h2>
      <ul id="recentLinks"></ul>
    </section>
  </main>

  <script>
    /* ---------- SEARCH LOGIC ---------- */
    function executeSearch() {
      const input = document.getElementById('search-input').value.trim();
      const engineBase = document.getElementById('search-engine-selector').value;
      if (!input) return;

      // URL detection: if it has a dot and no spaces
      if (input.includes('.') && !input.includes(' ')) {
        let url = input.startsWith('http') ? input : 'https://' + input;
        window.open(url, '_blank');
      } else {
        // Search using selected engine
        window.open(engineBase + encodeURIComponent(input), '_blank');
      }
    }

    // Enter key support for search
    document.getElementById('search-input').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') executeSearch();
    });

    /* ---------- MINIMIZE & RESTORE ---------- */
    let minimizedPanels = JSON.parse(localStorage.getItem('minimizedPanels') || '{}');

    function updateMinimizedSection() {
      const section = document.getElementById('minimized-section');
      const list = document.getElementById('minimized-list');
      const current = Object.keys(minimizedPanels).filter(id => minimizedPanels[id]);
      
      section.style.display = current.length > 0 ? 'block' : 'none';
      list.innerHTML = current.map(id => `
        <div class="minimized-item">
          ${id.charAt(0).toUpperCase() + id.slice(1)}
          <button class="restore-btn" onclick="restorePanel('${id}')">Restore</button>
        </div>
      `).join('');
    }

    function minimizePanel(id) {
      const el = document.querySelector(`[data-card="${id}"]`);
      if (el) {
        el.style.display = 'none';
        minimizedPanels[id] = true;
        localStorage.setItem('minimizedPanels', JSON.stringify(minimizedPanels));
        updateMinimizedSection();
      }
    }

    function restorePanel(id) {
      const el = document.querySelector(`[data-card="${id}"]`);
      if (el) {
        el.style.display = 'block';
        minimizedPanels[id] = false;
        localStorage.setItem('minimizedPanels', JSON.stringify(minimizedPanels));
        updateMinimizedSection();
      }
    }

    document.getElementById('restore-all').onclick = () => {
      Object.keys(minimizedPanels).forEach(id => restorePanel(id));
    };

    // Attach listeners to minimize buttons
    document.querySelectorAll('.minimize-btn').forEach(btn => {
      btn.onclick = () => minimizePanel(btn.getAttribute('data-card'));
    });

    /* ---------- TILES & BOOKMARKS ---------- */
    const TILES = [
      { name: "ChatGPT", url: "https://chatgpt.com", note: "ai" },
      { name: "Gemini", url: "https://gemini.google.com/app", note: "ai" },
      { name: "Claude", url: "https://claude.ai", note: "ai" },
      { name: "DeepSeek", url: "https://chat.deepseek.com", note: "ai" },
      { name: "Grok", url: "https://grok.com", note: "ai" },
      { name: "Google News", url: "https://news.google.com/", note :"news" },
      { name: "BBC Sounds", url: "https://www.bbc.co.uk/sounds", note: "audio" },
      { name: "Spotify", url: "https://open.spotify.com", note: "music" },
      { name: "YouTube", url: "https://www.youtube.com", note: "video" },
      { name: "Facebook", url: "https://www.facebook.com", note: "social" },
      { name: "Reddit", url: "https://www.reddit.com", note: "forums" },
      { name: "Goodreads", url: "https://www.goodreads.com", note: "books" },
      { name: "The Guardian", url: "https://www.theguardian.com", note: "news" },
      { name: "Wikipedia", url: "https://en.wikipedia.org", note: "reference" },
      { name: "Co-op Bank", url: "https://www.co-operativebank.co.uk", note: "banking" },
      { name: "Gmail", url: "https://www.gmail.com", note: "email" },
      { name: "GDrive", url: "https://drive.google.com/drive/u/0/my-drive", note: "files" }   
    ];

    function faviconFor(url) {
      try { return `https://www.google.com/s2/favicons?domain=${new URL(url).hostname}&sz=64`; } catch { return ""; }
    }

    document.getElementById("tiles").innerHTML = TILES.map(t => `
      <a class="tile" href="${t.url}" target="_blank">
        <div class="tileRow">
          <img class="favicon" src="${faviconFor(t.url)}" alt="" />
          <div><div class="tileTitle">${t.name}</div><div class="tileMeta">${t.note}</div></div>
        </div>
      </a>`).join("");

    /* ---------- CORE UTILITIES ---------- */
    function tick() {
      const d = new Date();
      document.getElementById("clock").textContent = d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
      document.getElementById("date").textContent = d.toLocaleDateString([], { weekday: "long", year: "numeric", month: "short", day: "numeric" });
    }
    setInterval(tick, 1000); tick();

    /* ---------- GMAIL UNREAD COUNT ---------- */
async function fetchGmailCount() {
  try {
    const response = await fetch('cgi-bin/gmail_unread.py');
    if (!response.ok) throw new Error(`HTTP error ${response.status}`);
    
    const data = await response.json();
    const gmailDiv = document.getElementById('gmail-count');
    
    if (data.error) {
      gmailDiv.innerHTML = `<span style="color: #ff4444;">Error: ${data.error}</span>`;
    } else {
      const count = data.count || 0;
      if (count === 0) {
        gmailDiv.innerHTML = '📭 No unread emails';
      } else if (count === 1) {
        gmailDiv.innerHTML = '📨 1 unread email';
      } else {
        gmailDiv.innerHTML = `📨 ${count} unread emails`;
      }
      
      // Make it clickable to open Gmail
      gmailDiv.style.cursor = 'pointer';
      gmailDiv.onclick = () => window.open('https://mail.google.com', '_blank');
    }
  } catch (error) {
    console.error('Gmail fetch error:', error);
    document.getElementById('gmail-count').innerHTML = 
      `<span style="color: #ff4444;">Failed to load</span>`;
  }
}

// Call it on page load and refresh every 5 minutes
fetchGmailCount();
setInterval(fetchGmailCount, 300000); // 5 minutes

    const notes = document.getElementById("notes");
    notes.value = localStorage.getItem("dashboard_notes") || "";
    notes.oninput = () => localStorage.setItem("dashboard_notes", notes.value);

    // Initial minimized state check
    window.onload = () => {
      Object.keys(minimizedPanels).forEach(id => { if(minimizedPanels[id]) minimizePanel(id); });
      updateMinimizedSection();
    };

    /* ---------- TIMER ---------- */
    let timerInterval = null;
    document.getElementById('timerBtn').onclick = function() {
      if (document.body.classList.contains('flashing-active')) {
        document.body.classList.remove('flashing-active');
        this.textContent = "⏲ Set Timer";
        return;
      }
      const input = prompt("Minutes (e.g. 10) or Time (e.g. 15:30):");
      if (!input) return;
      let target = input.includes(':') ? new Date().setHours(...input.split(':')) : Date.now() + input * 60000;
      this.classList.add('active');
      timerInterval = setInterval(() => {
        let diff = target - Date.now();
        if (diff <= 0) {
          clearInterval(timerInterval);
          document.body.classList.add('flashing-active');
          this.textContent = "⚠️ STOP";
        } else {
          this.textContent = `⏳ ${Math.ceil(diff/60000)}m`;
        }
      }, 1000);
    };

    /* ---------- CHECK-IN ---------- */
    document.querySelectorAll('.toggle[data-key]').forEach(btn => {
      btn.onclick = () => btn.classList.toggle('active');
    });
    document.getElementById('submit-checkin').onclick = () => {
      const keys = Array.from(document.querySelectorAll('.toggle.active[data-key]')).map(b => b.dataset.key);
      document.getElementById('checkin-status').textContent = "Saved: " + keys.join(', ');
    };
  </script>
</body>
</html>
