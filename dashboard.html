<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Dashboard</title>
  <link rel="icon" type="image/jpeg" href="FALC.jpg" />
  <link rel="stylesheet" href="css/dashboard.css" />
</head>
<body>
  <header>
    <button id="timerBtn" class="toggle" style="margin-left: 10px; padding: 10px 16px; font-size: 14px;">⏲ Set Timer</button>
    <div class="spacer"></div>
    <div id="weather" style="margin-right: 16px; font-size: 20px; font-weight: 600;"><a href="https://www.bbc.co.uk/weather/2654675" target="_blank" style="color: inherit; text-decoration: none;"><span id="weather-icon"></span> <span id="weather-temp">--°C</span></a></div>
    <div><div class="clock" id="clock">--:--</div><div class="date" id="date">---</div></div>
  </header>
  <main>
    <section class="card" data-card="daily-checkin" id="checkin-card">
      <h2>Daily Check-in <span id="checkin-day" style="font-size:0.8em;font-weight:400;color:var(--muted);margin-left:0.4em;"></span> <button class="minimize-btn" data-card="daily-checkin">×</button></h2>
      <div class="checkin-group"><div class="checkin-label">🍺 Drink</div><div class="checkin-options" data-group="drink"><button class="ci-btn" data-value="0">None</button><button class="ci-btn" data-value="1-2">1–2</button><button class="ci-btn" data-value="3-6">3–6</button><button class="ci-btn" data-value="6+">6+</button></div></div>
      <div class="checkin-group"><div class="checkin-label">🚬 Smoked</div><div class="checkin-options" data-group="smoked"><button class="ci-btn" data-value="yes">Yes</button><button class="ci-btn" data-value="no">No</button><button class="ci-btn" data-value="buy-fags">Buy Fags</button></div></div>
      <div class="checkin-group"><div class="checkin-label">😴 Sleep</div><div class="checkin-options" data-group="sleep"><button class="ci-btn" data-value="good">Good</button><button class="ci-btn" data-value="medium-good">Medium-good</button><button class="ci-btn" data-value="medium-bad">Medium-bad</button><button class="ci-btn" data-value="bad">Bad</button></div></div>
      <div class="checkin-group"><div class="checkin-label">🎮 Civ</div><div class="checkin-options" data-group="civ"><button class="ci-btn" data-value="yes">Yes</button><button class="ci-btn" data-value="no">No</button></div></div>
      <div style="margin-top: 1rem;"><button id="submit-checkin" disabled style="opacity:0.4;cursor:not-allowed;">Submit</button><span id="checkin-status" style="margin-left:0.5rem;font-size:0.85rem;color:var(--muted);"></span></div>
    </section>
    <section class="card" data-card="arena"><h2>Arena <button id="refresh-arena-btn" style="margin-left: 8px; padding: 4px 10px; font-size: 11px; background: rgba(76, 175, 80, 0.1); border: 1px solid #4CAF50; color: #4CAF50; border-radius: 6px; cursor: pointer; transition: 0.2s;">↻ Refresh</button><button class="minimize-btn" data-card="arena">×</button></h2><iframe id="arena-iframe" src="cgi-bin/arena.py" style="width: 100%; height: 300px; border: 1px solid var(--border); border-radius: var(--radius); background: #000;"></iframe><div class="terminal-container"><div class="terminal-output" id="terminal-output"></div><div class="terminal-input-container"><input type="text" id="terminal-input" placeholder="td 5" autocomplete="off"></div></div></section>
    <section class="card" data-card="quick-launch"><h2>Quick Launch <button class="minimize-btn" data-card="quick-launch">×</button></h2><div class="search-container"><button id="search-go-btn" onclick="executeSearch()">Go</button><div class="engine-dropdown" id="engine-dropdown"><div class="engine-selected" id="engine-selected" onclick="toggleEngineDropdown()"><img id="engine-icon" src="https://www.google.com/s2/favicons?domain=google.com&sz=32" alt=""><span id="engine-label">Google</span></div><div class="engine-options" id="engine-options"><div class="engine-option active" data-url="https://google.com/search?q=" data-domain="google.com">Google</div><div class="engine-option" data-url="https://en.wikipedia.org/wiki/Special:Search?search=" data-domain="wikipedia.org">Wikipedia</div><div class="engine-option" data-url="https://www.reddit.com/search/?q=" data-domain="reddit.com">Reddit</div><div class="engine-option" data-url="https://x.com/search?q=" data-domain="x.com">X</div><div class="engine-option" data-url="https://www.youtube.com/results?search_query=" data-domain="youtube.com">YouTube</div><div class="engine-option" data-url="https://www.amazon.co.uk/s?k=" data-domain="amazon.co.uk">Amazon UK</div><div class="engine-option" data-url="https://www.goodreads.com/search?q=" data-domain="goodreads.com">Goodreads</div><div class="engine-option" data-url="https://www.gov.uk/search/all?keywords=" data-domain="gov.uk">Gov.uk</div></div></div><select id="search-engine-selector" class="search-select"><option value="https://google.com/search?q=" data-domain="google.com">Google</option><option value="https://en.wikipedia.org/wiki/Special:Search?search=" data-domain="wikipedia.org">Wikipedia</option><option value="https://www.reddit.com/search/?q=" data-domain="reddit.com">Reddit</option><option value="https://x.com/search?q=" data-domain="x.com">X</option><option value="https://www.youtube.com/results?search_query=" data-domain="youtube.com">YouTube</option><option value="https://www.amazon.co.uk/s?k=" data-domain="amazon.co.uk">Amazon UK</option><option value="https://www.goodreads.com/search?q=" data-domain="goodreads.com">Goodreads</option><option value="https://www.gov.uk/search/all?keywords=" data-domain="gov.uk">Gov.uk</option></select><div id="search-autocomplete-wrapper" style="position:relative;flex:1;"><input type="text" id="search-input" placeholder="Search..." autocomplete="off"></div></div><div class="tile-groups-wrapper"><div class="tile-groups-collapsed-bar" id="tile-groups-collapsed"></div><div class="tile-groups-open" id="tile-groups-open"></div></div></section>
    <section class="card" data-card="gmail"><h2>Gmail <button class="minimize-btn" data-card="gmail">×</button></h2><div id="gmail-count">Loading...</div></section>
    <section class="card" data-card="notes"><h2>Notes <button class="minimize-btn" data-card="notes">×</button></h2><textarea id="notes" placeholder="Type your note… add #tags inline"></textarea><div style="display:flex;align-items:center;gap:10px;margin-top:8px;"><button id="notes-log-btn">📝 Log It</button><span id="notes-status"></span></div></section>
    <section class="card" data-card="shopping"><h2>Shopping List <button class="minimize-btn" data-card="shopping">×</button></h2><div id="shopping-list" style="font-size:14px;line-height:2;">Loading...</div></section>
    <section class="card" data-card="food-diary" style="flex:1 0 calc(33.333% - 10px);max-width:calc(33.333% - 10px);"><h2>🍽️ Food Diary <button class="minimize-btn" data-card="food-diary">×</button></h2><div style="display:flex;flex-direction:column;gap:10px;"><textarea id="food-diary-text" placeholder="What did you eat or make?" rows="3"></textarea><label><input type="file" id="food-diary-photo" accept="image/*" style="display:none;"><span id="food-diary-photo-label">📷 Add photo</span><span id="food-diary-photo-name"></span></label><div style="display:flex;align-items:center;gap:10px;"><button id="food-diary-submit">Log it</button><button id="food-diary-none">None</button><span id="food-diary-status"></span></div><div id="food-diary-recent"></div></div></section>
    <section class="card" data-card="rss-feeds" style="flex:1 0 calc(33.333% - 10px);max-width:calc(33.333% - 10px);"><h2>📰 RSS Feeds <button class="minimize-btn" data-card="rss-feeds">×</button></h2><div id="rss-feed-container" style="max-height:300px;overflow-y:auto;font-size:0.9rem;line-height:1.4;"><p style="color:var(--muted);">Loading feeds...</p></div></section>
  </main>
  <script src="js/search.js"></script><script src="js/terminal.js"></script><script src="js/panels.js"></script><script src="js/tiles.js"></script><script src="js/gmail.js"></script><script src="js/weather.js"></script><script src="js/notes.js"></script><script src="js/timer.js"></script><script src="js/checkin.js"></script><script src="js/shopping.js"></script><script src="js/rss.js"></script>
</body>
</html>
